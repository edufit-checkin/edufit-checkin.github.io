<style>
:root{
  --bg:#F5F5F7;--card:#FFFFFF;--accent:#0071E3;--accent-soft:#E8F1FC;
  --text:#1D1D1F;--text-2:#6E6E73;--success:#34C759;--success-soft:#E7F8EC;
  --danger:#FF3B30;--danger-soft:#FDEAE9;--warn:#8A5A00;--warn-soft:#FFF6E5;
  --border:#D2D2D7;--radius:14px;--radius-lg:20px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;}
button{font-family:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
.wrap{max-width:440px;margin:0 auto;
  padding:max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(28px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));}
header{display:flex;align-items:center;gap:10px;margin:8px 0 18px;}
.logo{width:40px;height:40px;border-radius:11px;background:var(--accent);display:flex;align-items:center;justify-content:center;flex:none;}
.logo svg{width:24px;height:24px;}
h1{font-size:22px;margin:0;font-weight:700;letter-spacing:-0.3px;}
.chip{display:flex;align-items:center;gap:8px;padding:12px 14px;border-radius:var(--radius);font-size:15px;font-weight:600;margin-bottom:14px;}
.chip::before{content:"";width:9px;height:9px;border-radius:50%;background:currentColor;flex:none;}
.chip.in{background:var(--success-soft);color:#1E8E3E;}
.chip.out{background:var(--accent-soft);color:var(--accent);}
.chip.closed,.chip.wait{background:#EDEDEF;color:var(--text-2);}
.chip.err{background:var(--danger-soft);color:var(--danger);}
.card{background:var(--card);border-radius:var(--radius-lg);padding:20px;box-shadow:0 1px 2px rgba(0,0,0,0.04);}
label{display:block;font-size:14px;font-weight:600;margin:0 0 6px;}
input{width:100%;padding:14px;border-radius:12px;border:1px solid var(--border);font-size:18px;margin-bottom:16px;background:#fff;color:var(--text);-webkit-appearance:none;appearance:none;}
input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
#last4{letter-spacing:8px;font-weight:700;font-variant-numeric:tabular-nums;}
.btn{display:flex;align-items:center;justify-content:center;width:100%;border:none;border-radius:var(--radius);padding:17px;font-size:17px;font-weight:700;cursor:pointer;}
.btn:active{transform:scale(0.98);}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary.in{background:#1E8E3E;}
.btn-ghost{background:#EDEDEF;color:var(--text);}
.btn:disabled{opacity:0.4;cursor:not-allowed;transform:none;}
.hint{word-break:keep-all;font-size:13px;color:var(--text-2);line-height:1.55;margin:14px 2px 0;}
.result{text-align:center;padding:30px 20px 22px;}
.result .icon{width:76px;height:76px;border-radius:50%;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;}
.result .icon svg{width:40px;height:40px;}
.result.ok .icon{background:var(--success-soft);color:#1E8E3E;}
.result.done .icon{background:var(--accent-soft);color:var(--accent);}
.result.bad .icon{background:var(--warn-soft);color:var(--warn);}
.result{word-break:keep-all;}
.result h2{font-size:21px;margin:0 0 8px;letter-spacing:-0.3px;}
.result .who{font-size:17px;font-weight:600;margin-bottom:4px;}
.result .when{font-size:15px;color:var(--text-2);margin-bottom:6px;}
.result p{font-size:14.5px;color:var(--text-2);line-height:1.55;margin:4px 0 20px;white-space:pre-line;}
.spinner{width:22px;height:22px;border:3px solid rgba(255,255,255,0.4);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.hidden{display:none !important;}
.foot{text-align:center;font-size:12px;color:#A1A1A6;margin-top:22px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="7" r="4"/><path d="M2 21v-2a4 4 0 0 1 4-4h6a4 4 0 0 1 4 4v2"/><polyline points="16 11 18 13 22 9"/></svg>
    </div>
    <h1>출석 체크인</h1>
  </header>

  <div class="chip wait" id="chip">연결하는 중…</div>

  <div class="card" id="formCard">
    <form id="form" autocomplete="off" novalidate>
      <label for="name">이름</label>
      <input id="name" type="text" placeholder="홍길동" autocomplete="name" autocorrect="off" spellcheck="false" enterkeyhint="next">
      <label for="last4">휴대전화 뒷자리 4자리</label>
      <input id="last4" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="0000" autocomplete="off" enterkeyhint="done">
      <button class="btn btn-primary" id="submit" type="submit" disabled>잠시만 기다려주세요</button>
    </form>
    <p class="hint" id="hint">입력한 정보는 출석 확인에만 쓰이며, 이름과 번호는 서버에 저장되지 않아요.</p>
  </div>

  <div class="card result hidden" id="resultCard">
    <div class="icon" id="rIcon"></div>
    <h2 id="rTitle"></h2>
    <div class="who" id="rWho"></div>
    <div class="when" id="rWhen"></div>
    <p id="rMsg"></p>
    <button class="btn btn-ghost" id="back">처음으로</button>
  </div>

  <div class="foot">에듀핏 체크인</div>
</div>

const ICON_OK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
const ICON_WARN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="7" x2="12" y2="13"/><circle cx="12" cy="17" r="0.6" fill="currentColor"/><circle cx="12" cy="12" r="10"/></svg>';

const pub = (new URLSearchParams(location.search).get("e") || "").toLowerCase();

let fs = null, db = null, eventDoc = null, mode = null, busy = false;

/* 담당자 앱과 똑같은 정규화 규칙 */
const normName = (s) => String(s == null ? "" : s).trim().replace(/\s+/g, "").toLowerCase();
const onlyDigits = (s) => String(s == null ? "" : s).replace(/[^0-9]/g, "");

/* 담당자 앱과 같은 규칙·반복 횟수 (PBKDF2-SHA256) */
const KEY_ITER = 150000;
async function deriveKey(secret){
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey("raw", enc.encode(secret), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits(
    { name: "PBKDF2", salt: enc.encode("edufit|" + pub), iterations: KEY_ITER, hash: "SHA-256" }, base, 128);
  return Array.from(new Uint8Array(bits)).map(b => b.toString(16).padStart(2, "0")).join("");
}

function earliest(data, prefix){
  let best = null;
  for (const k of Object.keys(data || {})){
    if (k.indexOf(prefix) !== 0) continue;
    const v = data[k];
    if (typeof v === "string" && v && (!best || new Date(v) < new Date(best))) best = v;
  }
  return best;
}

function hhmm(iso){
  const d = new Date(iso);
  return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
}

function setChip(cls, text){ const c = $("chip"); c.className = "chip " + cls; c.textContent = text; }

function renderMode(){
  const btn = $("submit");
  if (busy) return;
  if (mode === "in"){
    setChip("in", "출석 접수 중");
    btn.disabled = false; btn.className = "btn btn-primary in"; btn.textContent = "출석하기";
  } else if (mode === "out"){
    setChip("out", "종료 접수 중");
    btn.disabled = false; btn.className = "btn btn-primary"; btn.textContent = "종료 확인하기";
  } else {
    setChip("closed", "지금은 접수 시간이 아니에요");
    btn.disabled = true; btn.className = "btn btn-primary"; btn.textContent = "접수 시간이 되면 열려요";
  }
}

function fatal(text){
  setChip("err", text);
  $("submit").disabled = true;
  $("submit").textContent = "사용할 수 없어요";
}

function showResult(kind, title, who, when, msg){
  const card = $("resultCard");
  card.className = "card result " + kind;
  $("rIcon").innerHTML = kind === "bad" ? ICON_WARN : ICON_OK;
  $("rTitle").textContent = title;
  $("rWho").textContent = who || "";
  $("rWhen").textContent = when || "";
  $("rMsg").textContent = msg || "";
  $("formCard").classList.add("hidden");
  card.classList.remove("hidden");
  window.scrollTo(0, 0);
}

function withTimeout(p, ms){
  return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), ms))]);
}

async function submit(e){
  e.preventDefault();
  if (busy || !eventDoc) return;
  const nameRaw = $("name").value.trim();
  const l4 = onlyDigits($("last4").value);
  if (!nameRaw){ $("name").focus(); return; }
  if (l4.length !== 4){ $("last4").focus(); return; }

  const actMode = mode;
  if (actMode !== "in" && actMode !== "out") return;
  busy = true;
  const btn = $("submit");
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
  document.activeElement && document.activeElement.blur();

  try{
    const key = await deriveKey(normName(nameRaw) + "|" + l4);
    try{ localStorage.setItem(SAVE_KEY, JSON.stringify({ name: nameRaw, last4: l4 })); }catch(_){}

    // 명단 확인과 출석 기록을 동시에 1건씩 조회 (명단 전체는 받을 수 없음)
    const ref = fs.doc(db, "events", pub, "records", key);
    const [rosterSnap, snap] = await withTimeout(Promise.all([
      fs.getDoc(fs.doc(db, "events", pub, "roster", key)),
      fs.getDoc(ref)
    ]), 10000);
    const inRoster = rosterSnap.exists();
    const isDup = inRoster && !!(rosterSnap.data() || {}).dup;

    if (isDup){
      showResult("bad", "담당자 확인이 필요해요", nameRaw, "",
        "이름과 번호 뒷자리가 같은 분이 있어\nQR로는 확인할 수 없어요.\n담당자가 직접 확인해 드릴게요.");
      return;
    }
    if (!inRoster){
      showResult("bad", "명단에서 찾지 못했어요", nameRaw, "",
        "이름과 휴대전화 뒷자리를 다시 확인해주세요.\n계속 안 되면 담당자에게 말씀해주세요.");
      return;
    }

    const rec = snap.exists() ? snap.data() : {};
    const t1 = earliest(rec, "t1_"), t2 = earliest(rec, "t2_");
    const now = new Date().toISOString();

    if (actMode === "in"){
      if (t1){
        showResult("done", "이미 출석 확인되었어요", nameRaw, "출석 " + hhmm(t1), "");
        return;
      }
      await withTimeout(fs.setDoc(ref, { t1_self: now, updatedAt: fs.serverTimestamp() }, { merge: true }), 10000);
      showResult("ok", "출석 확인되었습니다", nameRaw, "출석 " + hhmm(now), "교육이 끝나면 같은 QR로\n종료 확인을 해주세요.");
    } else {
      if (!t1){
        showResult("bad", "출석 기록이 없어요", nameRaw, "",
          "입장할 때 출석 확인이 되지 않았어요.\n담당자에게 말씀해주세요.");
        return;
      }
      if (t2){
        showResult("done", "이미 종료 확인되었어요", nameRaw, "출석 " + hhmm(t1) + " · 종료 " + hhmm(t2), "");
        return;
      }
      await withTimeout(fs.setDoc(ref, { t2_self: now, updatedAt: fs.serverTimestamp() }, { merge: true }), 10000);
      showResult("ok", "종료 확인되었습니다", nameRaw, "출석 " + hhmm(t1) + " · 종료 " + hhmm(now), "오늘 교육에 참여해 주셔서 감사합니다.");
    }
  }catch(err){
    console.error(err);
    const offline = (err && err.message === "timeout") || !navigator.onLine;
    showResult("bad", offline ? "인터넷 연결을 확인해주세요" : "확인하지 못했어요", nameRaw, "",
      offline ? "연결이 불안정해요. 잠시 후 다시 시도해주세요." : "잠시 후 다시 시도해주세요.\n계속 안 되면 담당자에게 말씀해주세요.");
  }finally{
    busy = false;
    renderMode();
  }
}

async function start(){
  if (!/^[0-9a-f]{12}$/.test(pub)){ fatal("올바른 QR이 아니에요. 다시 찍어주세요."); return; }
  if (!window.crypto || !crypto.subtle){ fatal("이 브라우저에서는 사용할 수 없어요."); return; }

  try{
    const saved = JSON.parse(localStorage.getItem(SAVE_KEY) || "null");
    if (saved){ $("name").value = saved.name || ""; $("last4").value = saved.last4 || ""; }
  }catch(_){}

  $("last4").addEventListener("input", (e) => {
    const v = onlyDigits(e.target.value).slice(0, 4);
    if (e.target.value !== v) e.target.value = v;
  });
  $("name").addEventListener("keydown", (e) => { if (e.key === "Enter"){ e.preventDefault(); $("last4").focus(); } });
  $("form").addEventListener("submit", submit);
  $("back").addEventListener("click", () => {
    $("resultCard").classList.add("hidden");
    $("formCard").classList.remove("hidden");
  });

  try{
    const appM = await import(SDK + "firebase-app.js");
    const authM = await import(SDK + "firebase-auth.js");
    fs = await import(SDK + "firebase-firestore.js");
    const app = appM.initializeApp(FIREBASE_CONFIG);
    db = fs.getFirestore(app);
    const auth = authM.getAuth(app);
    const user = await new Promise((res) => { const un = authM.onAuthStateChanged(auth, (u) => { un(); res(u); }); });
    if (!user) await authM.signInAnonymously(auth);

    fs.onSnapshot(fs.doc(db, "events", pub), (d) => {
      if (!d.exists()){ eventDoc = null; mode = null; fatal("끝났거나 없는 행사예요. 담당자에게 문의해주세요."); return; }
      eventDoc = d.data() || {};
      mode = eventDoc.mode || "closed";
      renderMode();
    }, (err) => { console.error(err); fatal("연결하지 못했어요. 잠시 후 새로고침해주세요."); });
  }catch(err){
    console.error(err);
    fatal("연결하지 못했어요. 인터넷 연결을 확인해주세요.");
  }
}

start();
</script>
